[package]
name = "tree-sitter-quo"
description = "Quo language"
version = "0.1.0"
authors = ["Vlad Krupinskii <vladkrupinskii@gmail.com>"]
license = "ZLib"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "quo"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/quo-lang/tree-sitter-quo"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.12"
