[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-quo"
description = "Quo language"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "quo"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Vlad Krupinskii", email = "vladkrupinskii@gmail.com" }]
requires-python = ">=3.10"
license.text = "ZLib"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/quo-lang/tree-sitter-quo"
Funding = ""

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
